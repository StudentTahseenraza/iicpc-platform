events {
    worker_connections 1024;
}

http {
    upstream backend_cluster {
        least_conn;
        server backend-1:3000 weight=1 max_fails=3 fail_timeout=30s;
        server backend-2:3000 weight=1 max_fails=3 fail_timeout=30s;
        server backend-3:3000 weight=1 max_fails=3 fail_timeout=30s;
    }
    
    upstream websocket_cluster {
        ip_hash;  # Sticky sessions for WebSockets
        server backend-1:3000;
        server backend-2:3000;
        server backend-3:3000;
    }
    
    server {
        listen 80;
        server_name localhost;
        
        client_max_body_size 50M;
        
        # API routes
        location /api {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # WebSocket routes
        location /socket.io {
            proxy_pass http://websocket_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
        }
        
        # Health check
        location /health {
            proxy_pass http://backend_cluster/health;
            access_log off;
        }
        
        # Static files
        location / {
            proxy_pass http://frontend:5173;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}